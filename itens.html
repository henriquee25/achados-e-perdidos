<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itens encontrados | Achados e Perdidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container">
                <a class="navbar-brand" href="index.html">Achados e Perdidos</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-principal"
                    aria-controls="menu-principal" aria-expanded="false" aria-label="Abrir menu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menu-principal">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                        <li class="nav-item"><a class="nav-link active" aria-current="page" href="itens.html">Itens encontrados</a></li>
                        <li class="nav-item"><a class="nav-link" href="perdi-algo.html">Solicitações</a></li>
                        <li class="nav-item"><a class="nav-link" href="correspondencias.html">Correspondências</a></li>
                        <li class="nav-item"><a class="nav-link" href="locais.html">Locais</a></li>
                    </ul>

                    <button id="btn-tema" class="btn btn-outline-secondary">Modo escuro</button>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-4">

        <div id="alertas"></div>

        <h1 class="mb-4">Itens encontrados</h1>

        <div class="row g-4">

            <section class="col-12 col-lg-4">
                <div class="card">
                    <div class="card-body">
                        <h2 class="h4 mb-3">Cadastrar item</h2>

                        <form id="form-item">
                            <div class="mb-3">
                                <label for="item-descricao" class="form-label">Descrição</label>
                                <input type="text" id="item-descricao" class="form-control" placeholder="Ex.: Fone de ouvido preto">
                                <div id="erro-item-descricao" class="invalid-feedback"></div>
                            </div>

                            <div class="mb-3">
                                <label for="item-categoria" class="form-label">Categoria</label>
                                <input type="text" id="item-categoria" class="form-control" placeholder="Ex.: Eletrônicos">
                                <div id="erro-item-categoria" class="invalid-feedback"></div>
                            </div>

                            <div class="mb-3">
                                <label for="item-cor" class="form-label">Cor</label>
                                <input type="text" id="item-cor" class="form-control" placeholder="Ex.: Preto">
                                <div id="erro-item-cor" class="invalid-feedback"></div>
                            </div>

                            <div class="mb-3">
                                <label for="item-local" class="form-label">Local onde foi encontrado</label>
                                <select id="item-local" class="form-select">
                                    <option value="">Selecione</option>
                                </select>
                                <div id="erro-item-local" class="invalid-feedback"></div>
                            </div>

                            <div class="mb-3">
                                <label for="item-data" class="form-label">Data em que foi encontrado</label>
                                <input type="date" id="item-data" class="form-control">
                                <div id="erro-item-data" class="invalid-feedback"></div>
                            </div>

                            <div class="acoes d-flex flex-wrap gap-2">
                                <button type="submit" id="btn-salvar-item" class="btn btn-primary">Cadastrar</button>
                                <button type="button" id="btn-cancelar-item" class="btn btn-outline-secondary" hidden>Cancelar edição</button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>

            <section class="col-12 col-lg-8">
                <h2 class="h4 mb-3">Itens cadastrados</h2>

                <div class="row g-3 mb-3">
                    <div class="col-12 col-md-6">
                        <label for="busca-itens" class="form-label">Buscar</label>
                        <input type="search" id="busca-itens" class="form-control" placeholder="Descrição ou cor">
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="filtro-categoria" class="form-label">Categoria</label>
                        <select id="filtro-categoria" class="form-select">
                            <option value="">Todas</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="filtro-local" class="form-label">Local</label>
                        <select id="filtro-local" class="form-select">
                            <option value="">Todos</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="ordenar-itens" class="form-label">Ordenar por</label>
                        <select id="ordenar-itens" class="form-select">
                            <option value="recentes">Mais recentes</option>
                            <option value="antigos">Mais antigos</option>
                            <option value="a-z">A–Z</option>
                        </select>
                    </div>
                </div>

                <ul id="abas-status" class="nav nav-pills mb-3">
                    <li class="nav-item"><button class="nav-link active" data-status="aguardando">Aguardando</button></li>
                    <li class="nav-item"><button class="nav-link" data-status="reclamado">Reclamados</button></li>
                    <li class="nav-item"><button class="nav-link" data-status="devolvido">Devolvidos</button></li>
                    <li class="nav-item"><button class="nav-link" data-status="doado">Doados</button></li>
                </ul>

                <div id="lista-itens" class="row row-cols-1 row-cols-md-2 g-3"></div>

                <p id="mensagem-vazia-itens" class="mt-3" hidden>Nenhum item encontrado.</p>
            </section>

        </div>

    </main>

    <footer class="rodape py-4">
        <div class="container">
            <p>Achados e Perdidos • Desenvolvimento Web I</p>
        </div>
    </footer>

    <div id="modal-excluir" class="modal-excluir" hidden>
        <div class="modal-excluir-fundo"></div>
        <div class="modal-excluir-caixa">
            <h2>Confirmar exclusão</h2>
            <p id="modal-excluir-texto">Tem certeza que deseja excluir este registro?</p>
            <div class="acoes d-flex flex-wrap gap-2">
                <button id="btn-confirmar-exclusao" class="btn btn-danger">Excluir</button>
                <button id="btn-cancelar-exclusao" class="btn btn-outline-secondary">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/itens.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
