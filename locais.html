<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locais | Achados e Perdidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container">
                <a class="navbar-brand" href="index.html"><i class="bi bi-search"></i> Achados e Perdidos</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-principal"
                    aria-controls="menu-principal" aria-expanded="false" aria-label="Abrir menu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menu-principal">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                        <li class="nav-item"><a class="nav-link" href="itens.html">Itens encontrados</a></li>
                        <li class="nav-item"><a class="nav-link" href="perdi-algo.html">Solicitações</a></li>
                        <li class="nav-item"><a class="nav-link" href="correspondencias.html">Correspondências</a></li>
                        <li class="nav-item"><a class="nav-link active" aria-current="page" href="locais.html">Locais</a></li>
                    </ul>

                    <button id="btn-tema" class="btn btn-outline-secondary">Modo escuro</button>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-4">

        <h1 class="mb-4">Locais</h1>

        <div class="row g-4">

            <section class="col-12 col-lg-4">
                <div class="card">
                    <div class="card-body">
                        <h2 class="h4 mb-3">Cadastrar local</h2>

                        <form id="form-local">
                            <div class="mb-3">
                                <label for="local-nome" class="form-label">Nome do local</label>
                                <input type="text" id="local-nome" class="form-control" placeholder="Ex.: Biblioteca">
                                <div id="erro-local-nome" class="invalid-feedback"></div>
                            </div>

                            <div class="mb-3">
                                <label for="local-bloco" class="form-label">Bloco</label>
                                <input type="text" id="local-bloco" class="form-control" placeholder="Ex.: Bloco A">
                                <div id="erro-local-bloco" class="invalid-feedback"></div>
                            </div>

                            <div class="acoes d-flex flex-wrap gap-2">
                                <button type="submit" id="btn-salvar-local" class="btn btn-primary">Cadastrar</button>
                                <button type="button" id="btn-cancelar-local" class="btn btn-outline-secondary" hidden>Cancelar edição</button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>

            <section class="col-12 col-lg-8">
                <h2 class="h4 mb-3">Locais cadastrados</h2>

                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Local</th>
                                <th>Bloco</th>
                                <th>Itens</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="lista-locais"></tbody>
                    </table>
                </div>

                <p id="mensagem-vazia-locais" class="mt-3">Nenhum local cadastrado.</p>
            </section>

        </div>

    </main>

    <footer class="rodape py-4">
        <div class="container">
            <p>Achados e Perdidos • Desenvolvimento Web I</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/locais.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
